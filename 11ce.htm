<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>11ce · 雙模式播放器 v4</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#080808;color:#eee;font-family:system-ui,sans-serif}

/* ── 單圖模式 ── */
#single{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:1}
#single.hide{display:none}
/* width/height 100% + object-fit:cover + position bottom → fills screen, never cuts the bottom */
#media{width:100%;height:100%;object-fit:cover;object-position:center bottom;display:block;transition:transform .15s ease;transform-origin:center center}

/* ── 網格模式 ── */
#grid{position:fixed;inset:0;overflow-y:scroll;overflow-x:hidden;display:none;z-index:1;padding:6px 6px 56px}
#grid.show{display:block}

:root{--cols:3;--row-h:200px}

/*
  grid-auto-rows = 固定列高，每列完全相同高度。
  每個 .item 撐滿格子 (width/height 100%)，
  媒體用 object-fit:contain → 完整顯示，黑色 letterbox 填空白，不裁切。
*/
.gal{
  display:grid;
  grid-template-columns:repeat(var(--cols),1fr);
  grid-auto-rows:var(--row-h);
  gap:6px;
}
.item{
  background:#111;border-radius:5px;overflow:hidden;
  cursor:zoom-in;position:relative;
  display:flex;align-items:center;justify-content:center;
  width:100%;height:100%;
  transition:box-shadow .12s;
}
.item:hover{box-shadow:0 0 0 2px #6cf}
.item img,.item video{
  display:block;pointer-events:none;
  width:100%;height:100%;
  object-fit:contain;
}

/* ── UI panel ── */
.ui{position:fixed;bottom:10px;right:10px;background:rgba(12,12,22,.90);
    padding:6px;border-radius:8px;z-index:300;backdrop-filter:blur(8px);
    transition:opacity .3s,transform .3s}
.ui.hide{opacity:0;pointer-events:none;transform:translateY(8px)}
.ctrl{display:grid;grid-template-columns:repeat(3,32px);grid-template-rows:repeat(3,32px);gap:4px}
.ctrl button{width:32px;height:32px;background:rgba(255,255,255,.12);border:none;
             border-radius:5px;color:#ddd;cursor:pointer;font-size:11px;
             display:flex;align-items:center;justify-content:center;font-weight:700}
.ctrl button:hover{background:rgba(255,255,255,.28)}

/* ── status bar ── */
#stat{position:fixed;top:8px;left:8px;background:rgba(8,8,18,.88);
      padding:5px 10px;border-radius:5px;font-size:12px;z-index:300;
      max-width:80vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── help ── */
#help{position:fixed;top:44px;right:10px;background:rgba(12,12,22,.96);
      padding:12px;border-radius:8px;font-size:12px;line-height:1.75;
      z-index:400;display:none;max-width:270px;box-shadow:0 6px 24px rgba(0,0,0,.7)}
#help.show{display:block}
.k{color:#8af;font-weight:700}

/* ── pause overlay ── */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;
    align-items:center;justify-content:center;z-index:500;font-size:18px;
    color:#fff;pointer-events:none}
#ov.show{display:flex}

/* ── hover URL toast ── */
#hoverUrl{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);
          background:rgba(0,0,0,.88);color:#fff;padding:5px 14px;
          border-radius:6px;font-size:11px;z-index:9999;
          max-width:92vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
          opacity:0;transition:opacity .18s;pointer-events:none}
#hoverUrl.show{opacity:1}

/* ── pager (only appears when more items remain) ── */
#pager{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);
       background:rgba(20,20,30,.9);padding:4px 12px;border-radius:6px;
       font-size:11px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
#pager.show{opacity:1}

/* ════════════════════════════════════════
   LIGHTBOX — position:absolute on children
   so the <img> can fill inset:0 naturally
════════════════════════════════════════ */
#lightbox{
  position:fixed;inset:0;background:#000;
  z-index:1000;display:none;
  cursor:default;            /* always show cursor */
}
#lightbox.show{display:block}

/* media fills the full viewport */
#lbMedia{
  display:block;
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:contain;        /* full-screen, no crop */
}

#lbUrl{
  position:absolute;bottom:36px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.78);color:#bbb;padding:4px 14px;border-radius:5px;
  font-size:11px;max-width:94vw;word-break:break-all;text-align:center;
  pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#lbNav{
  position:absolute;top:50%;left:0;right:0;
  display:flex;justify-content:space-between;padding:0 18px;
  transform:translateY(-50%);pointer-events:none;
}
#lbNav button{
  pointer-events:all;
  background:rgba(255,255,255,.16);border:none;color:#fff;
  padding:10px 20px;border-radius:7px;cursor:pointer;font-size:15px;
  transition:background .15s;
}
#lbNav button:hover{background:rgba(255,255,255,.34)}
#lbClose{
  position:absolute;top:14px;right:18px;
  background:rgba(0,0,0,.5);border:none;color:#fff;
  font-size:24px;line-height:1;cursor:pointer;
  border-radius:50%;width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s;
}
#lbClose:hover{background:rgba(200,50,50,.85)}
#lbCoord{
  position:absolute;bottom:8px;right:12px;
  background:rgba(0,0,0,.6);color:#8cf;
  padding:3px 10px;border-radius:4px;font-size:11px;font-family:monospace;
  pointer-events:none;
}
</style></head><body>

<div id="single"><img id="media" alt=""></div>
<div id="grid"><div class="gal" id="gal"></div></div>
<div id="stat">⏳ 解析中...</div>

<div id="help">
  <div class="k">← / →</div> 單圖：上/下頁 ｜ 網格：欄數 ±1<br>
  <div class="k">↑ / ↓</div> 單圖：縮放 ｜ 網格：列高 ±30px<br>
  <div class="k">Space</div> 單圖：暫停/繼續 ｜ 網格：捲動 開/關<br>
  <div class="k">L</div> 同 Space（網格捲動切換）<br>
  <div class="k">[ / ]</div> 單圖：速度慢/快 ｜ 網格：捲速 -/+<br>
  <div class="k">G</div> 切換 單圖 ↔ 網格<br>
  <div class="k">F</div> 全螢幕切換<br>
  <div class="k">H</div> UI 顯示/隱藏<br>
  <div class="k">? / Esc</div> 說明 / 關閉<br>
  <small style="opacity:.65">🖱 懸停縮圖→URL ｜ 點擊→燈箱全螢幕</small>
</div>

<div class="ui" id="ui"><div class="ctrl">
  <button id="bPrev" title="上一張">◀</button>
  <button id="bPlay" title="暫停/播放">⏸</button>
  <button id="bNext" title="下一張">▶</button>
  <button id="bZoom" title="放大">+</button>
  <button id="bMode" title="切換模式">⊞</button>
  <button id="bZoomOut" title="縮小">−</button>
  <button id="bCMin" title="欄−">C−</button>
  <button id="bFull" title="全螢幕">⛶</button>
  <button id="bCPlus" title="欄+">C+</button>
</div></div>

<div id="ov">⏹ 已暫停</div>
<div id="hoverUrl"></div>
<div id="pager">⏳ 載入中…</div>

<div id="lightbox">
  <img id="lbMedia" alt="">
  <div id="lbUrl"></div>
  <div id="lbCoord"></div>
  <div id="lbNav">
    <button id="lbPrev">◀</button>
    <button id="lbNext">▶</button>
  </div>
  <button id="lbClose">×</button>
</div>

<script src="1nlines.js"></script>
<script>
(function(){
'use strict';

const $=id=>document.getElementById(id);
const root=document.documentElement;
const css=(k,v)=>root.style.setProperty(k,v);

/* DOM */
const single=$('single'),grid=$('grid'),gal=$('gal');
const stat=$('stat'),ov=$('ov'),ui=$('ui');
const hoverUrl=$('hoverUrl'),pager=$('pager');
const lb=$('lightbox'),lbUrl=$('lbUrl'),lbCoord=$('lbCoord');
const lbPrev=$('lbPrev'),lbNext=$('lbNext');

/* state */
let list=[],idx=0,scale=1;
let playing=true,speed=2500,singleTimer=null;
let mode='single',cols=3;
/* Smart default: aim for 4 rows filling the viewport.
   1024×768 → floor(768/4)=192  1920×1080 → 270  etc.
   User can still adjust with ↑/↓.  Min 60, max 700. */
let rowH=Math.max(60,Math.floor(window.innerHeight/4));
let gridRendered=0;
const BATCH=40;
let gridAuto=false,scrollTick=null;
/* scrollSpeed: px per tick. 1=slow … 5=fast. Default 2. */
let scrollSpeed=2;
const SCROLL_MS=20;
let uiTimer=null,cursorTimer=null,uiLocked=false;
let lbIdx=0;

/* ── wait for external lib ── */
function waitForLib(cb){
  if(window.LinesLib&&LinesLib.FOLDER_IMAGES) cb();
  else setTimeout(()=>waitForLib(cb),80);
}

/* ── build media list ── */
function buildList(){
  const res=[];
  Object.keys(LinesLib.FOLDER_IMAGES).forEach(f=>{
    const conf=LinesLib.FOLDER_IMAGES[f];
    let files=[];
    if(Array.isArray(conf)){
      if(typeof conf[0]==='string'){
        files=conf.map(s=>s.trim()).filter(Boolean);
      } else if(conf.length===2&&typeof conf[0]==='number'){
        const s=String(conf[1]).trim();
        const m=s.match(/(\d+)(?=\.[^/.]+$)/);
        if(m){
          const n=+m[1],pad=m[1].length;
          const sl=s.lastIndexOf('/');
          const pre=sl>=0?s.slice(0,sl+1):'';
          const ext=s.split('.').pop();
          for(let i=0;i<conf[0];i++)
            files.push(pre+String(n+i).padStart(pad,'0')+'.'+ext);
        }
      }
    }
    files.forEach(fn=>{
      if(!fn) return;
      let url='';
      try{if(LinesLib.imgSrc) url=LinesLib.imgSrc(f,fn);}catch(e){}
      if(!url){
        const iv=/\.(mp4|webm|m4v|mov)$/i.test(fn);
        url=iv?(fn.includes('/')?`./img/${f}/${fn}`:`./img/m4/${fn}`):`./img/${f}/${fn}`;
      }
      res.push({name:fn,url,type:/\.(mp4|webm|m4v|mov)$/i.test(fn)?'video':'image'});
    });
  });
  return res;
}

/* ── make element ── */
function makeEl(item){
  const iv=item.type==='video';
  const el=document.createElement(iv?'video':'img');
  el.src=item.url;el.alt=item.name;el.loading='lazy';
  if(iv){el.muted=true;el.loop=true;el.playsInline=true;el.autoplay=false;}
  return el;
}

/* ══ SINGLE MODE ══ */
function renderSingle(i){
  idx=((i%list.length)+list.length)%list.length;
  const item=list[idx];
  const nel=makeEl(item);
  nel.id='media';
  /* fill screen: width/height 100%, object-fit:cover; scale on top */
  nel.style.cssText=`width:100%;height:100%;display:block;object-fit:cover;object-position:center bottom;
    transform:scale(${scale});transform-origin:center center;transition:transform .15s ease`;
  const cur=$('media');
  if(cur) cur.replaceWith(nel); else single.appendChild(nel);
  stat.textContent=`▶ ${item.name}  (${idx+1}/${list.length})`;
}
function singleLoop(){
  if(!playing||mode!=='single') return;
  idx=(idx+1)%list.length;
  renderSingle(idx);
  singleTimer=setTimeout(singleLoop,speed);
}
function stopSingle(){clearTimeout(singleTimer);singleTimer=null;}
function togglePlay(){
  playing=!playing;
  $('bPlay').textContent=playing?'⏸':'▶';
  ov.classList.toggle('show',!playing);
  if(playing&&mode==='single') singleLoop(); else stopSingle();
}

/* ══ GRID — render batch ══ */
function statGrid(){
  const scrollLabel=gridAuto?`▶ ${scrollSpeed}px/tick`:'⏹停';
  stat.textContent=`⊞ ${list.length}項 | 欄:${cols} | 高:${rowH}px | ${scrollLabel}`;
}
function renderBatch(start,count){
  const end=Math.min(start+count,list.length);
  if(start>=end){pager.classList.remove('show');return;}
  const frag=document.createDocumentFragment();
  for(let i=start;i<end;i++){
    const item=list[i];
    const div=document.createElement('div');
    div.className='item';
    div.addEventListener('mouseenter',()=>{hoverUrl.textContent=item.url;hoverUrl.classList.add('show');});
    div.addEventListener('mouseleave',()=>hoverUrl.classList.remove('show'));
    div.addEventListener('click',e=>{e.stopPropagation();openLightbox(i);});
    div.appendChild(makeEl(item));
    frag.appendChild(div);
  }
  gal.appendChild(frag);
  gridRendered=end;
  /* pager: show only when MORE items still unrendered */
  pager.classList.toggle('show',gridRendered<list.length);
  statGrid();
}

/* ══ GRID — auto-scroll ══
   scrollSpeed px every SCROLL_MS ms.
   [ / ] slow/fast — same keys as single-mode, context-aware.
   Space in grid mode = toggle gridAuto (same as L).
*/
function startScroll(){
  if(scrollTick) return;
  scrollTick=setInterval(()=>{
    if(!gridAuto||mode!=='grid'){stopScroll();return;}
    const bot=grid.scrollTop+grid.clientHeight>=grid.scrollHeight-2;
    if(bot){
      if(gridRendered<list.length){
        renderBatch(gridRendered,BATCH);
      } else {
        grid.scrollTop=0;
      }
    } else {
      grid.scrollTop+=scrollSpeed;
    }
  },SCROLL_MS);
}
function stopScroll(){clearInterval(scrollTick);scrollTick=null;}

/* manual scroll → lazy load */
grid.addEventListener('scroll',()=>{
  if(mode!=='grid'||gridRendered>=list.length) return;
  if(grid.scrollTop+grid.clientHeight>=grid.scrollHeight-120)
    renderBatch(gridRendered,BATCH);
},{passive:true});

/* ══ MODE TOGGLE ══ */
function showGrid(){
  mode='grid';
  single.classList.add('hide');stopSingle();
  grid.classList.add('show');
  gal.innerHTML='';gridRendered=0;
  pager.classList.remove('show');
  renderBatch(0,BATCH);
  if(gridAuto) startScroll();
}
function showSingle(){
  mode='single';
  grid.classList.remove('show');stopScroll();
  single.classList.remove('hide');
  renderSingle(idx);
  if(playing) singleLoop();
}
function toggleMode(){mode==='single'?showGrid():showSingle();}

/* ══ COLS / ROW HEIGHT ══ */
function setCols(d){cols=Math.max(1,Math.min(8,cols+d));css('--cols',cols);if(mode==='grid')statGrid();}
function setRowH(d){rowH=Math.max(60,Math.min(700,rowH+d));css('--row-h',rowH+'px');if(mode==='grid')statGrid();}

/* ══ LIGHTBOX ══ */
/* position:absolute;inset:0 → fills the fixed #lightbox container 100% */
const LB='display:block;position:absolute;inset:0;width:100%;height:100%;object-fit:contain';

function openLightbox(i){
  lbIdx=((i%list.length)+list.length)%list.length;
  const item=list[lbIdx];
  let cur=$('lbMedia');
  if(item.type==='video'){
    if(cur.tagName!=='VIDEO'){
      const v=document.createElement('video');
      v.id='lbMedia';v.autoplay=true;v.loop=true;v.muted=true;v.playsInline=true;
      v.style.cssText=LB;cur.replaceWith(v);cur=v;
    }
  } else {
    if(cur.tagName==='VIDEO'){
      const img=document.createElement('img');
      img.id='lbMedia';img.alt='';img.style.cssText=LB;
      cur.replaceWith(img);cur=img;
    }
  }
  cur.src=item.url;
  lbUrl.textContent=item.url;
  lb.classList.add('show');
  /* cursor always visible in lightbox */
  document.body.style.cursor='auto';
  clearTimeout(cursorTimer);
}
function closeLightbox(){
  lb.classList.remove('show');
  const m=$('lbMedia');if(m)m.src='';
  resetUITimer();
}
function lbNav(d){lbIdx=((lbIdx+d)+list.length)%list.length;openLightbox(lbIdx);}

/* ══ UI AUTO-HIDE ══ */
function lbOpen(){return lb.classList.contains('show');}
function resetUITimer(){
  if(uiLocked) return;
  ui.classList.remove('hide');document.body.style.cursor='auto';
  clearTimeout(uiTimer);clearTimeout(cursorTimer);
  uiTimer=setTimeout(()=>{if(!lbOpen())ui.classList.add('hide');},3500);
  cursorTimer=setTimeout(()=>{if(!lbOpen())document.body.style.cursor='none';},3500);
}
document.addEventListener('mousemove',resetUITimer,{passive:true});
document.addEventListener('click',resetUITimer,{passive:true});

function toggleUI(){
  uiLocked=!uiLocked;
  if(uiLocked){
    ui.classList.add('hide');clearTimeout(uiTimer);clearTimeout(cursorTimer);
    if(!lbOpen()) document.body.style.cursor='none';
  } else resetUITimer();
}

/* ══ FULLSCREEN ══ */
function toggleFS(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen().catch(()=>{});
}

/* ══ KEYBOARD ══ */
document.addEventListener('keydown',e=>{
  if(lbOpen()){
    if(e.key==='Escape'){closeLightbox();return;}
    if(e.key==='ArrowLeft'){lbNav(-1);return;}
    if(e.key==='ArrowRight'){lbNav(+1);return;}
  }
  if(mode==='single'){
    if(e.key==='ArrowLeft') renderSingle(idx-1);
    if(e.key==='ArrowRight') renderSingle(idx+1);
    if(e.key==='ArrowUp'){scale=Math.min(3,+(scale+0.2).toFixed(1));const m=$('media');if(m)m.style.transform=`scale(${scale})`;}
    if(e.key==='ArrowDown'){scale=Math.max(0.3,+(scale-0.2).toFixed(1));const m=$('media');if(m)m.style.transform=`scale(${scale})`;}
  } else {
    if(e.key==='ArrowLeft') setCols(-1);
    if(e.key==='ArrowRight') setCols(+1);
    if(e.key==='ArrowUp'){e.preventDefault();setRowH(+30);}
    if(e.key==='ArrowDown'){e.preventDefault();setRowH(-30);}
  }
  /* Space: single=pause/play, grid=auto-scroll toggle */
  if(e.key===' '){
    e.preventDefault();
    if(mode==='single') togglePlay();
    else {
      gridAuto=!gridAuto;
      gridAuto?startScroll():stopScroll();
      statGrid();
    }
  }
  if(e.key.toLowerCase()==='g') toggleMode();
  if(e.key.toLowerCase()==='f') toggleFS();
  if(e.key.toLowerCase()==='h') toggleUI();
  if(e.key.toLowerCase()==='l'){
    gridAuto=!gridAuto;
    if(mode==='grid'){gridAuto?startScroll():stopScroll();}
    if(mode==='grid') statGrid();
  }
  /* [ / ] : single → adjust slideshow interval; grid → adjust scroll speed */
  if(e.key==='['){
    if(mode==='single') speed=Math.min(9000,speed+300);
    else { scrollSpeed=Math.max(1,scrollSpeed-1); statGrid(); }
  }
  if(e.key===']'){
    if(mode==='single') speed=Math.max(400,speed-300);
    else { scrollSpeed=Math.min(20,scrollSpeed+1); statGrid(); }
  }
  if(e.key==='?') $('help').classList.toggle('show');
  if(e.key==='Escape') $('help').classList.remove('show');
});

/* ══ BUTTONS ══ */
$('bPrev').onclick=()=>{if(mode==='single')renderSingle(idx-1);resetUITimer();};
$('bNext').onclick=()=>{if(mode==='single')renderSingle(idx+1);resetUITimer();};
$('bPlay').onclick=()=>{togglePlay();resetUITimer();};
$('bZoom').onclick=()=>{scale=Math.min(3,+(scale+0.2).toFixed(1));const m=$('media');if(m)m.style.transform=`scale(${scale})`;resetUITimer();};
$('bZoomOut').onclick=()=>{scale=Math.max(0.3,+(scale-0.2).toFixed(1));const m=$('media');if(m)m.style.transform=`scale(${scale})`;resetUITimer();};
$('bMode').onclick=()=>{toggleMode();resetUITimer();};
$('bFull').onclick=()=>{toggleFS();resetUITimer();};
$('bCMin').onclick=()=>{setCols(-1);resetUITimer();};
$('bCPlus').onclick=()=>{setCols(+1);resetUITimer();};
$('lbClose').onclick=()=>closeLightbox();
lb.addEventListener('click',e=>{if(e.target===lb)closeLightbox();});
lbPrev.onclick=()=>lbNav(-1);
lbNext.onclick=()=>lbNav(+1);
lb.addEventListener('mousemove',e=>{
  const m=$('lbMedia');if(!m)return;
  const r=m.getBoundingClientRect();
  const ix=Math.round(e.clientX-r.left),iy=Math.round(e.clientY-r.top);
  lbCoord.textContent=(ix>=0&&iy>=0&&ix<=r.width&&iy<=r.height)
    ?`🖼 ${ix}×${iy} / ${Math.round(r.width)}×${Math.round(r.height)}`
    :`🖱 ${e.clientX},${e.clientY}`;
},{passive:true});

/* ══ INIT ══ */
waitForLib(()=>{
  const p=new URLSearchParams(location.search);
  if(p.get('cols')) cols=Math.max(1,Math.min(8,+p.get('cols')));
  if(p.get('rowH'))  rowH=Math.max(60,Math.min(700,+p.get('rowH')));
  if(p.get('auto')==='1') gridAuto=true;
  css('--cols',cols);css('--row-h',rowH+'px');
  list=buildList();
  if(!list.length){stat.textContent='⚠️ 無媒體 (確認 1nlines.js 已載入)';return;}
  renderSingle(0);
  if(playing) singleLoop();
  stat.textContent=`✓ ${list.length} 項就緒`;
  resetUITimer();
});

})();
</script>
</body></html>
