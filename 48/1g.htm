<!DOCTYPE html https://www.vava8.com/index.php?app=index&act=view&id=46119
https://www.vava8.com/index.php?app=index&act=view&id=46211>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Perchance 批量提取 - 文件夹模式</title>
<style>
  body{font-family:"Microsoft YaHei",sans-serif;padding:20px;background:#222;color:#ddd;}
  button{padding:12px 24px;font-size:18px;margin:10px;}
  #log{background:#111;padding:15px;height:400px;overflow:auto;font-family:monospace;white-space:pre-wrap;}
</style>
</head>
<body>
<h1>Perchance HTML 文件夹批量提取图片</h1>
<button onclick="selectFolder()">1. 选择包含所有 .html 的文件夹</button>
<button onclick="clearLog()">清空日志</button>

<div id="log"></div>

<script>
async function selectFolder() {
  try {
    const dirHandle = await window.showDirectoryPicker();
    log(`已选择文件夹，开始扫描...`);

    let count = 0;
    for await (const entry of dirHandle.values()) {
      if (entry.kind === 'file' && entry.name.toLowerCase().endsWith('.html')) {
        count++;
        log(`处理: ${entry.name}`);
        const file = await entry.getFile();
        const text = await file.text();
        
        const images = extractImages(text);
        for (let i = 0; i < images.length; i++) {
          const {dataUrl} = images[i];
          const filename = entry.name.replace(/\.html?$/i, '') + (images.length > 1 ? `_${i+1}` : '') + '.jpg';
          download(dataUrl, filename);
          log(`  ✓ ${filename}`);
        }
      }
    }
    log(`\n完成！共处理 ${count} 个 HTML 文件`);
  } catch(e) {
    log("错误: " + e.message);
  }
}

function extractImages(html) {
  const results = [];
  const regex = /data:image\/jpeg;base64,([A-Za-z0-9+/=]+)/gi;
  let match;
  while ((match = regex.exec(html)) !== null) {
    results.push({
      dataUrl: `data:image/jpeg;base64,${match[1]}`
    });
  }
  return results;
}

function download(dataUrl, filename) {
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = filename;
  a.click();
}

function log(msg) {
  document.getElementById('log').textContent += msg + "\n";
  document.getElementById('log').scrollTop = 999999;
}

function clearLog() {
  document.getElementById('log').textContent = '';
}
</script>
</body>
</html>
