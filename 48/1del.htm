<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1del — 批次刪除檔案</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;max-width:720px;margin:0 auto;padding:20px;line-height:1.7;background:#fafafa;color:#222;}
h1{font-size:18px;margin:0 0 4px;}
.sub{color:#888;font-size:12px;margin:0 0 18px;}
.card{background:#fff;border:1px solid #e8e8e8;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);padding:16px 18px;margin-bottom:18px;}
.card h2{font-size:14px;margin:0 0 12px;color:#444;display:flex;align-items:center;gap:6px;}
.row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.row label{font-size:13px;color:#555;min-width:78px;}
input[type="text"],input[type="password"]{flex:1;min-width:160px;padding:6px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;font-family:Consolas,Monaco,monospace;}
input:focus{outline:none;border-color:#e74c3c;box-shadow:0 0 0 3px rgba(231,76,60,.12);}
.btn{padding:6px 14px;border:none;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;transition:transform .1s,box-shadow .2s;background:#f0f0f0;color:#333;border:1px solid #ddd;}
.btn:hover{transform:translateY(-1px);}
.btn.primary{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;border:none;box-shadow:0 2px 8px rgba(102,126,234,.3);}
.btn.danger{background:#e74c3c;color:#fff;border:none;box-shadow:0 2px 8px rgba(231,76,60,.3);}
.btn.danger:hover{background:#c0392b;}
.btn.secondary{background:#f0f0f0;color:#333;border:1px solid #ddd;}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.hint{font-size:11px;color:#999;margin:2px 0 0 88px;}
.file-list{margin-top:10px;max-height:300px;overflow-y:auto;font-size:13px;}
.file-list .item{display:flex;align-items:center;gap:8px;padding:4px 6px;border-bottom:1px solid #f2f2f2;cursor:pointer;transition:background .15s;}
.file-list .item:hover{background:#f8f8f8;}
.file-list .item .name{flex:1;font-family:Consolas,Monaco,monospace;font-size:12px;word-break:break-all;}
.file-list .item .size{color:#999;font-size:12px;flex-shrink:0;}
.file-list .item input[type="checkbox"]{width:16px;height:16px;cursor:pointer;flex-shrink:0;}
.file-list .item .dir-icon{color:#f39c12;}
.file-list .item .file-icon{color:#3498db;}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center;}
.progress{height:6px;border-radius:4px;background:#eee;overflow:hidden;margin-top:10px;display:none;}
.progress.show{display:block;}
.progress > div{height:100%;width:0%;background:linear-gradient(135deg,#e74c3c 0%,#c0392b 100%);transition:width .15s;}
.status{font-size:12px;color:#666;margin-top:8px;white-space:pre-wrap;}
.status.err{color:#c44;}
.status.ok{color:#2a9d5c;}
.ping-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ccc;margin-right:4px;}
.ping-dot.ok{background:#2a9d5c;}
.ping-dot.err{background:#c44;}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);background:rgba(34,34,34,.92);color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;}
</style>
</head>
<body>

<h1>🗑️ 1del — 批次刪除檔案</h1>
<p class="sub">搭配 <code>1receiver.php</code> 使用，可批次刪除指定子目錄下的檔案／資料夾。</p>

<div class="card">
    <h2>⚙️ 連線設定</h2>
    <div class="row">
        <label>接收端網址</label>
        <input type="text" id="receiverUrl" placeholder="https://your-site.com/1receiver.php">
    </div>
    <div class="hint">指向你上傳到 InfinityFree 的 1receiver.php 完整網址</div>
    <div class="row">
        <label>密碼</label>
        <input type="password" id="secret" placeholder="1receiver.php 裡的 $SECRET" autocomplete="off">
        <label style="min-width:auto;display:flex;align-items:center;gap:4px;"><input type="checkbox" id="remember"> 記住於此瀏覽器</label>
    </div>
    <div class="row">
        <label>目標子目錄</label>
        <input type="text" id="targetDir" value="/tfc/">
        <button class="btn primary" id="testBtn"><span class="ping-dot" id="pingDot"></span>測試連線</button>
        <button class="btn secondary" id="clearSecretBtn">清除密碼</button>
    </div>
    <div class="status" id="connStatus"></div>
</div>

<div class="card">
    <h2>📂 瀏覽 &amp; 選擇要刪除的檔案</h2>
    <div class="row">
        <button class="btn primary" id="refreshBtn">🔄 重新整理</button>
        <span style="font-size:12px;color:#888;" id="fileCount">0 個項目</span>
    </div>
    <div class="file-list" id="fileList">
        <div style="color:#999;padding:8px 4px;">點擊「重新整理」載入檔案清單</div>
    </div>
    <div class="actions">
        <button class="btn secondary" id="selectAllBtn">☑️ 全選</button>
        <button class="btn secondary" id="deselectAllBtn">☐ 取消全選</button>
        <button class="btn danger" id="deleteBtn" disabled>🗑️ 刪除選取 (<span id="selectedCount">0</span>)</button>
    </div>
    <div class="progress" id="deleteProgress"><div></div></div>
    <div class="status" id="deleteStatus"></div>
</div>

<div id="toast"></div>

<script>
(function(){
    'use strict';

    var LS_URL = 'del_receiver_url';
    var LS_DIR = 'del_target_dir';
    var LS_SECRET = 'del_secret';

    var els = {
        receiverUrl: document.getElementById('receiverUrl'),
        secret: document.getElementById('secret'),
        remember: document.getElementById('remember'),
        targetDir: document.getElementById('targetDir'),
        testBtn: document.getElementById('testBtn'),
        clearSecretBtn: document.getElementById('clearSecretBtn'),
        connStatus: document.getElementById('connStatus'),
        pingDot: document.getElementById('pingDot'),
        refreshBtn: document.getElementById('refreshBtn'),
        fileList: document.getElementById('fileList'),
        fileCount: document.getElementById('fileCount'),
        selectAllBtn: document.getElementById('selectAllBtn'),
        deselectAllBtn: document.getElementById('deselectAllBtn'),
        deleteBtn: document.getElementById('deleteBtn'),
        selectedCount: document.getElementById('selectedCount'),
        deleteProgress: document.getElementById('deleteProgress'),
        deleteStatus: document.getElementById('deleteStatus'),
        toast: document.getElementById('toast')
    };

    els.receiverUrl.value = localStorage.getItem(LS_URL) || 'https://adm.gamer.gd/1receiver.php';
    els.targetDir.value = localStorage.getItem(LS_DIR) || '/tfc/';
    var savedSecret = localStorage.getItem(LS_SECRET);
    if (savedSecret) { els.secret.value = savedSecret; els.remember.checked = true; }

    els.receiverUrl.addEventListener('input', function(){ localStorage.setItem(LS_URL, els.receiverUrl.value.trim()); });
    els.targetDir.addEventListener('input', function(){ localStorage.setItem(LS_DIR, els.targetDir.value.trim()); });
    els.remember.addEventListener('change', function(){
        if (els.remember.checked) localStorage.setItem(LS_SECRET, els.secret.value);
        else localStorage.removeItem(LS_SECRET);
    });
    els.secret.addEventListener('input', function(){
        if (els.remember.checked) localStorage.setItem(LS_SECRET, els.secret.value);
    });
    els.clearSecretBtn.addEventListener('click', function(){
        els.secret.value = '';
        els.remember.checked = false;
        localStorage.removeItem(LS_SECRET);
        showToast('已清除密碼');
    });

    var fileItems = [];
    var selectedFiles = [];

    function showToast(msg){
        els.toast.textContent = msg;
        els.toast.style.opacity = '1';
        els.toast.style.transform = 'translateX(-50%) translateY(0)';
        clearTimeout(showToast._t);
        showToast._t = setTimeout(function(){
            els.toast.style.opacity = '0';
            els.toast.style.transform = 'translateX(-50%) translateY(16px)';
        }, 2200);
    }

    function fmtSize(n){
        if (n < 1024) return n + ' B';
        if (n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
        return (n/1024/1024).toFixed(2) + ' MB';
    }

    function receiverUrl(){ return els.receiverUrl.value.trim(); }
    function targetDir(){ return els.targetDir.value.trim() || '/'; }
    function secretVal(){ return els.secret.value; }

    // ---- 請求函數 ----
    function sendRequest(formData){
        return new Promise(function(resolve, reject){
            var url = receiverUrl();
            if (!url) { reject(new Error('請先填接收端網址')); return; }
            var xhr = new XMLHttpRequest();
            xhr.open('POST', url, true);
            xhr.setRequestHeader('X-Auth-Secret', secretVal());
            xhr.onload = function(){
                var data;
                try { data = JSON.parse(xhr.responseText); }
                catch(e) { reject(new Error('伺服器回應不是合法的 JSON：' + xhr.responseText.slice(0,200))); return; }
                if (xhr.status >= 200 && xhr.status < 300 && data.ok) resolve(data);
                else reject(new Error(data.error || ('HTTP ' + xhr.status)));
            };
            xhr.onerror = function(){ reject(new Error('連線失敗（網路錯誤或 CORS 被擋）')); };
            xhr.send(formData);
        });
    }

    // ---- 測試連線 ----
    els.testBtn.addEventListener('click', function(){
        var fd = new FormData();
        fd.append('action', 'ping');
        els.connStatus.textContent = '連線測試中…';
        els.connStatus.className = 'status';
        els.pingDot.className = 'ping-dot';
        sendRequest(fd).then(function(data){
            els.pingDot.className = 'ping-dot ok';
            els.connStatus.className = 'status ok';
            els.connStatus.textContent = '✅ 連線成功 — PHP ' + data.phpVersion +
                '，ZipArchive: ' + (data.zipArchive ? '有' : '沒有');
        }).catch(function(err){
            els.pingDot.className = 'ping-dot err';
            els.connStatus.className = 'status err';
            els.connStatus.textContent = '❌ ' + err.message;
        });
    });

    // ---- 列出檔案 ----
    function listFiles(){
        if (!receiverUrl()) { showToast('請先填接收端網址'); return; }
        els.fileList.innerHTML = '<div style="color:#999;padding:8px 4px;">載入中…</div>';
        var fd = new FormData();
        fd.append('action', 'list');
        fd.append('dir', targetDir());
        sendRequest(fd).then(function(data){
            fileItems = data.items || [];
            selectedFiles = [];
            renderFileList();
            els.fileCount.textContent = fileItems.length + ' 個項目';
            updateDeleteBtn();
        }).catch(function(err){
            els.fileList.innerHTML = '<div style="color:#c44;padding:8px 4px;">❌ ' + err.message + '</div>';
        });
    }

    function renderFileList(){
        if (fileItems.length === 0) {
            els.fileList.innerHTML = '<div style="color:#999;padding:8px 4px;">📭 目錄為空</div>';
            return;
        }
        var html = '';
        fileItems.forEach(function(item, idx){
            var checked = selectedFiles.indexOf(idx) !== -1 ? 'checked' : '';
            var icon = item.isDir ? '📁' : '📄';
            var iconClass = item.isDir ? 'dir-icon' : 'file-icon';
            html += '<div class="item" onclick="toggleItem(' + idx + ')">' +
                '<input type="checkbox" ' + checked + ' onclick="event.stopPropagation();toggleItem(' + idx + ')">' +
                '<span class="' + iconClass + '">' + icon + '</span>' +
                '<span class="name">' + item.name.replace(/</g,'&lt;') + (item.isDir ? '/' : '') + '</span>' +
                '<span class="size">' + (item.isDir ? '' : fmtSize(item.size)) + '</span>' +
                '</div>';
        });
        els.fileList.innerHTML = html;
        els.selectedCount.textContent = selectedFiles.length;
        updateDeleteBtn();
    }

    window.toggleItem = function(idx){
        var pos = selectedFiles.indexOf(idx);
        if (pos === -1) selectedFiles.push(idx);
        else selectedFiles.splice(pos, 1);
        renderFileList();
    };

    function updateDeleteBtn(){
        els.deleteBtn.disabled = selectedFiles.length === 0;
        els.selectedCount.textContent = selectedFiles.length;
    }

    els.refreshBtn.addEventListener('click', listFiles);

    els.selectAllBtn.addEventListener('click', function(){
        selectedFiles = fileItems.map(function(_, idx){ return idx; });
        renderFileList();
    });

    els.deselectAllBtn.addEventListener('click', function(){
        selectedFiles = [];
        renderFileList();
    });

    // ---- 批次刪除 ----
    els.deleteBtn.addEventListener('click', function(){
        if (selectedFiles.length === 0) return;
        var toDelete = selectedFiles.map(function(idx){ return fileItems[idx]; });
        var names = toDelete.map(function(item){ return item.name + (item.isDir ? '/' : ''); });

        if (!confirm('確定要刪除以下 ' + toDelete.length + ' 個項目嗎？\n\n' + names.join('\n') + '\n\n此操作無法復原！')) return;

        els.deleteBtn.disabled = true;
        els.deleteStatus.textContent = '刪除中…';
        els.deleteStatus.className = 'status';
        els.deleteProgress.classList.add('show');
        els.deleteProgress.querySelector('div').style.width = '0%';

        var total = toDelete.length;
        var done = 0;
        var failed = [];
        var deleted = [];

        function deleteNext(){
            if (done >= total) {
                els.deleteProgress.classList.remove('show');
                els.deleteBtn.disabled = false;
                var msg = '✅ 成功刪除 ' + deleted.length + ' 個項目';
                if (failed.length) msg += '，失敗 ' + failed.length + ' 個：' + failed.map(function(f){ return f.name + ' (' + f.error + ')'; }).join('；');
                els.deleteStatus.className = failed.length ? 'status err' : 'status ok';
                els.deleteStatus.textContent = msg;
                showToast(msg);
                listFiles(); // 重新整理清單
                return;
            }

            var item = toDelete[done];
            var fd = new FormData();
            fd.append('action', 'delete');
            fd.append('path', targetDir() + '/' + item.name);
            fd.append('isDir', item.isDir ? '1' : '0');

            sendRequest(fd).then(function(data){
                deleted.push(item.name);
                done++;
                els.deleteProgress.querySelector('div').style.width = ((done/total)*100) + '%';
                deleteNext();
            }).catch(function(err){
                failed.push({ name: item.name, error: err.message });
                done++;
                els.deleteProgress.querySelector('div').style.width = ((done/total)*100) + '%';
                deleteNext();
            });
        }

        deleteNext();
    });

    // ---- 自動初始化 ----
    setTimeout(function(){
        if (receiverUrl() && secretVal()) {
            els.testBtn.click();
            setTimeout(listFiles, 500);
        }
    }, 400);

})();
</script>
</body>
</html>
