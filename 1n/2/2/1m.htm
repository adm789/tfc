<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>杏夜絮語·本地優先沉浸版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#eee;font-family:system-ui,sans-serif;cursor:none} /* 預設隱藏滑鼠 */
body.show-cursor{cursor:auto} /* 互動時顯示 */
.ui-layer{position:fixed;top:0;left:0;right:0;z-index:200;transition:opacity 0.5s ease, transform 0.5s ease;opacity:1;transform:translateY(0)}
.ui-layer.hide{opacity:0;pointer-events:none;transform:translateY(-20px)}
#top{background:rgba(10,10,15,0.85);padding:8px 12px;display:flex;gap:10px;align-items:center;backdrop-filter:blur(5px)}
#top button{background:rgba(255,255,255,0.1);color:#ddd;border:none;padding:4px 12px;border-radius:4px;cursor:pointer;font-size:13px}
#stat{font-size:12px;color:#aaa;margin-left:auto}
#hvTip{position:fixed;top:50px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);color:#fff;padding:6px 14px;border-radius:6px;font-size:12px;z-index:300;max-width:90vw;text-align:center;line-height:1.4;word-break:break-all;opacity:0;transition:opacity .2s;pointer-events:none}
#hvTip.show{opacity:1}
#mediaBox{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#000;z-index:1}
#pic, #vid{max-width:100%;max-height:100%;object-fit:cover;transition:opacity .3s}
#txt{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.6);padding:10px 20px;border-radius:8px;max-width:85%;text-align:center;line-height:1.6;font-size:18px;z-index:10;pointer-events:none;text-shadow:0 1px 3px #000;transition:opacity 0.5s}
.ui-layer.hide ~ #txt{opacity:0.3}
#help{position:fixed;top:60px;right:15px;background:rgba(20,20,30,0.95);padding:15px;border-radius:8px;font-size:13px;line-height:1.8;z-index:250;display:none;width:220px;box-shadow:0 4px 15px rgba(0,0,0,0.6)}
#help.show{display:block}.k{color:#8af;font-weight:bold}
</style></head><body>

<div id="top" class="ui-layer"><span style="font-weight:bold">🌙 杏夜</span><button id="btnPlay">▶ 巡航</button><button id="btnReload">⟳</button><button id="btnHelp">?</button><span id="stat">[載入中]</span></div>
<div id="hvTip"></div>
<div id="mediaBox"><img id="pic" alt=""></div>
<div id="txt"></div>
<div id="help"><div class="k">Space</div> 暫停/巡航<br><div class="k">↑/↓</div> 加速/減速<br><div class="k">]/[</div> 放大/縮小字體<br><div class="k">R</div> 隨機換圖/片<br><div class="k">F</div> 全螢幕<br><div class="k">Click</div> 喚出介面<br><div class="k">?/Esc</div> 說明</div>

<script src="1nlines.js" onerror="initFallback()"></script>
<script>
function initFallback(){if(!window.LinesLib){window.LinesLib={getAll:()=>[{text:"月光落在鎖骨上，涼涼的，像一片薄霜。",folder:""}],imgSrc:(f,n)=>f?`./img/${f}/${n}`:`./img/${n}`,getImage:f=>(window.LinesLib.FOLDER_IMAGES[f]||['001.jpg'])[0],FOLDER_IMAGES:{'':['001.jpg']},autoDetectFolder:()=>''};document.getElementById('stat').textContent='⚠️離線';}}

(function(){
var txt=document.getElementById('txt'),pic=document.getElementById('pic'),mediaBox=document.getElementById('mediaBox'),stat=document.getElementById('stat'),tip=document.getElementById('hvTip');
var lines=[],idx=0,playing=false,speed=2500,hideTimer,cursorTimer;
var uiEls=document.querySelectorAll('.ui-layer');

// 🖱️ 滑鼠與介面自動隱藏邏輯
function resetTimers(){
  document.body.classList.add('show-cursor');
  uiEls.forEach(el=>el.classList.remove('hide'));
  clearTimeout(hideTimer); clearTimeout(cursorTimer);
  
  // 3.5秒後隱藏介面
  hideTimer=setTimeout(()=>{ if(playing) uiEls.forEach(el=>el.classList.add('hide')); }, 3500);
  // 3.5秒後隱藏滑鼠
  cursorTimer=setTimeout(()=>{ document.body.classList.remove('show-cursor'); }, 3500);
}
document.addEventListener('mousemove', resetTimers);
document.addEventListener('click', ()=>{ var h=uiEls[0].classList.contains('hide'); uiEls.forEach(el=>el.classList.toggle('hide',!h)); resetTimers(); });

// 🖱️ 懸停顯示網址
document.addEventListener('mouseover',e=>{if(e.target.tagName==='IMG'||e.target.tagName==='VIDEO'){tip.textContent=e.target.dataset.src||e.target.src;tip.classList.add('show')}});
document.addEventListener('mouseout',e=>{if(e.target.tagName==='IMG'||e.target.tagName==='VIDEO')tip.classList.remove('show')});

// 🎬 媒體渲染核心 (支援 Img/Video 自動切換)
function render(i){
  if(!lines.length)return;
  var item=lines[i%lines.length];
  txt.textContent=item.text;
  var f=item.folder||'', fn=String(LinesLib.getImage(f)).trim();
  
  // 1. 嘗試本地路徑 (Local First)
  var localUrl = f ? `./img/${f}/${fn}` : `./img/${fn}`;
  // 2. 備援網路路徑
  var netUrl = LinesLib.imgSrc(f, fn);
  
  // 判斷是否為影片 (支援 mp4, webm, mov)
  var isVideo = /\.(mp4|webm|mov)$/i.test(fn);
  
  // 清理舊媒體
  mediaBox.innerHTML='';
  
  var el = isVideo ? document.createElement('video') : document.createElement('img');
  el.id = isVideo?'vid':'pic';
  el.style.maxWidth='100%'; el.style.maxHeight='100%'; el.style.objectFit='cover';
  
  // 設定來源：先試本地，失敗則試網路
  el.src = localUrl; 
  el.dataset.src = localUrl; // Hover 顯示本地路徑
  
  if(isVideo){
    el.autoplay=true; el.loop=true; el.muted=true; el.playsInline=true;
    el.onerror=()=>{
      console.log('本地影片失敗，嘗試網路:', netUrl);
      el.src=netUrl; el.dataset.src=netUrl;
      el.onerror=()=>{stat.textContent='✗載入失敗'};
    };
  } else {
    el.onload=()=>{stat.textContent=`✓ ${fn}`};
    el.onerror=()=>{
      console.log('本地圖片失敗，嘗試網路:', netUrl);
      el.src=netUrl; el.dataset.src=netUrl;
      el.onerror=()=>{stat.textContent='✗載入失敗'};
    };
  }
  
  mediaBox.appendChild(el);
}
// 🎬 點擊影片播放/暫停邏輯
mediaBox.addEventListener('click', function(e) {
    var vid = document.getElementById('vid');
    if (vid && vid.tagName === 'VIDEO') {
        if (vid.paused) {
            vid.play();
            stat.textContent = '▶ 播放中';
        } else {
            vid.pause();
            stat.textContent = '⏸ 已暫停';
        }
        resetTimers(); // 點擊時喚醒介面
    }
});

// 💡 確保影片載入後也能自動播放（若處於巡航模式）
function checkAutoPlay() {
    var vid = document.getElementById('vid');
    if (vid && playing && vid.paused) {
        vid.play().catch(e => console.log('Autoplay blocked:', e));
    }
}
// 在 loop() 或 next() 執行後呼叫 checkAutoPlay()
function next(){idx=(idx+1)%lines.length;render(idx)}
function load(){
  stat.textContent='[載入中]';
  if(LinesLib&&LinesLib.getAll){
    lines=LinesLib.getAll();
    idx=Math.floor(Math.random()*lines.length);
    render(idx);
  }else setTimeout(load,100);
}

// ⌨️ 快捷鍵
document.addEventListener('keydown',e=>{
  resetTimers();
  if(e.key===' '){e.preventDefault();togglePlay()}
  else if(e.key==='ArrowUp')speed=Math.max(500,speed-200);
  else if(e.key==='ArrowDown')speed=Math.min(8000,speed+200);
  else if(e.key===']')txt.style.fontSize=parseInt(getComputedStyle(txt).fontSize)+2+'px';
  else if(e.key==='[')txt.style.fontSize=Math.max(12,parseInt(getComputedStyle(txt).fontSize)-2)+'px';
  else if(e.key.toLowerCase()==='r'){var c=lines[idx],f=c.folder||'',l=LinesLib.FOLDER_IMAGES[f]||LinesLib.FOLDER_IMAGES[''],fn=String(l[Math.floor(Math.random()*l.length)]).trim();render(idx);} // 強制重繪當前索引但換隨機圖
  else if(e.key.toLowerCase()==='f'){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen();}
  else if(e.key==='?'||e.key==='Escape')document.getElementById('help').classList.toggle('show');
});

function togglePlay(){
  playing=!playing;
  document.getElementById('btnPlay').textContent=playing?'⏸ 暫停':'▶ 巡航';
  if(playing){loop();resetTimers();}else uiEls.forEach(el=>el.classList.remove('hide'));
}
function loop(){if(!playing)return;next();setTimeout(loop,speed);}

document.getElementById('btnPlay').onclick=e=>{e.stopPropagation();togglePlay()};
document.getElementById('btnReload').onclick=e=>{e.stopPropagation();resetTimers();next()};
document.getElementById('btnHelp').onclick=e=>{e.stopPropagation();resetTimers();document.getElementById('help').classList.toggle('show')};
window.addEventListener('load',load);
})();
</script></body></html>
